name: Integration

# Layer 2 (docs/TESTING.md): the free route end to end with the real programs.
# A real Audiobookshelf (its pinned image), the real gateway, the real watcher
# and engine narrating with Kokoro on the CPU and aligning with MFA, then sync
# both ways through the real APIs. No key, no paid service, nothing faked but
# the reader. tools/integration/free_route.py says what it proves.
#
# About 15 minutes and two large image pulls (MFA, Audiobookshelf), so not on
# every push: nightly, by hand, and on a pull request labelled `integration`.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  free-route:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'integration')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      # The engine makes a KEPUB of every book. kepubify 4.0.4, pinned by its
      # sha256 exactly as install.sh pins it.
      - name: kepubify
        run: |
          curl -fsSL -o /tmp/kepubify https://github.com/pgaskin/kepubify/releases/download/v4.0.4/kepubify-linux-64bit
          echo "37d7628d26c5c906f607f24b36f781f306075e7073a6fe7820a751bb60431fc5  /tmp/kepubify" | sha256sum -c -
          sudo install -m 755 /tmp/kepubify /usr/local/bin/kepubify

      # CPU torch first: the default Linux wheel brings ~2.5 GB of CUDA.
      - name: Python dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-gateway.txt
          pip install -e .

      - name: The free route, end to end
        run: python -u tools/integration/free_route.py
