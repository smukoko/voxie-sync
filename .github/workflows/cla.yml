name: CLA

# CLA Assistant Lite: a contributor signs .github/CLA.md once, by replying on
# their first pull request with the sentence the CLA itself names. Signatures
# are kept in this repository, on the unprotected branch `cla-signatures`
# (main is protected, and the action must write). No app, no gist.
#
# pull_request_target runs with write access on pull requests from forks, so:
# this job never checks out or runs the pull request's code, and the action is
# pinned to a commit (v2.6.1), not to a tag that can move.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Only the public repository takes outside contributions.
    if: github.repository == 'smukoko/voxie-sync'
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/smukoko/voxie-sync/blob/main/.github/CLA.md
          branch: cla-signatures
          allowlist: smukoko,dependabot[bot]
          create-file-commit-message: "Create the CLA signature record"
          signed-commit-message: "$contributorName signed the CLA in #$pullRequestNo"
